# SPDX-License-Identifier: LGPL-2.1-or-later
#
# Every action in the workflows is pinned by commit, with the release it is in
# a comment. Pins nobody moves go stale; this is what moves them, as a pull
# request that goes through CI like any other change. LibreSCRS/ci is not
# moved here: every reference to it must name the same commit, and that commit
# is moved deliberately, in one change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: 'LibreSCRS/ci*'
    groups:
      actions:
        patterns: ['*']
