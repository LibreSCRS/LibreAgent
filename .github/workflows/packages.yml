# SPDX-License-Identifier: LGPL-2.1-or-later
name: Packages

# The distribution packages this repository publishes, built and installed the
# way the release builds them: in each distribution's own container, against
# LibreMiddleware packages built from the commit deps.lock names, then the
# whole stack installed in a clean container of the same image and judged
# (libraries resolve, one PKCS#11 provider, lintian/rpmlint). The build and the
# judgement are LibreSCRS/ci's (actions/pkg-build, actions/pkg-verify); what
# is this repository's own is the recipe under packaging/ and
# packaging/ci/verify-installed.sh.
#
# Only when something that goes into a package changes: every slug builds
# LibreMiddleware first, so this is the most expensive run the repository has,
# and LibreSCRS/ci runs the same chain for every repository weekly.

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - 'packaging/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'deps.lock'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/workflows/packages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'deps.lock'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/workflows/packages.yml'
  workflow_dispatch:

permissions: {}

jobs:
  packages:
    name: packages (${{ matrix.slug }})
    runs-on: ubuntu-24.04
    # Measured locally at -j4: LibreMiddleware 7-9 min and this repository 7-9
    # per slug, plus the verification; the bound leaves room for a slow runner.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slug: [debian13, ubuntu2604, fedora43, fedora44, opensusetw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the packages
        id: build
        uses: LibreSCRS/ci/actions/pkg-build@373a0f82c9af280b7a8ccc4ee30106c947394ca2
        with:
          slug: ${{ matrix.slug }}
          upstream: source

      - name: Install and judge the stack
        uses: LibreSCRS/ci/actions/pkg-verify@373a0f82c9af280b7a8ccc4ee30106c947394ca2
        with:
          slug: ${{ matrix.slug }}
          packages: ${{ steps.build.outputs.art }}/${{ matrix.slug }}
          report: ${{ runner.temp }}/pkg-report

      - name: Keep the logs of a failed build
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pkg-report-${{ matrix.slug }}
          path: |
            ${{ steps.build.outputs.art }}/log
            ${{ runner.temp }}/pkg-report
          retention-days: 7
