# SPDX-License-Identifier: LGPL-2.1-or-later
name: CI

# LibreAgent ships three independently-buildable components: the
# platform-neutral agent core (LibreAgent::Core, LM-backed), the socket-wire
# protocol library (LibreAgent::Wire, dependency-free), and the Qt client
# library LibreCelik consumes (LibreAgent::ClientQt, Wire + Qt6 only — no LM).
# This workflow has: a format gate; build-linux, a Core+Wire+ClientQt
# build+test job that first acquires LibreMiddleware from source (Core's sole
# external dependency, consumed via find_package(LibreMiddleware CONFIG)),
# checks the ABI snapshot (ClientQt is built here so that check's ClientQt
# sections actually see the shared library, not just the archives), plus
# a ThreadSanitizer gate over the concurrency core (scheduler + throttler);
# client, the same Core+Wire+ClientQt stack with Qt6 + D-Bus added, running
# the full suite including the D-Bus/socket/transport-parity integration
# tests (LibreCelik's actual build shape); client-lm-less, the guarantee that
# Wire+ClientQt build/test/install standalone on a runner where
# LibreMiddleware is never built or installed at all (a Qt-only consumer
# never needs to acquire LM) — also the one job exercising
# LIBREAGENT_INSTALL_WIRE_ARCHIVE=OFF, the subdir-version smoke, and the
# tests/pkgsmoke ClientQt / co-installation-stub case; and fuzz-cbor, a
# libFuzzer+ASan gate over the untrusted-input CBOR decoder both
# Wire-consuming components share.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs. Without this, a change that only misbehaves on a macOS runner
  # can be exercised nowhere before it lands: every other job here is Linux, and
  # a branch that is not a pull request gets no run at all.
  workflow_dispatch:

jobs:
  format-check:
    # Self-contained: the format gate needs neither LibreMiddleware nor any
    # runtime dependency, so it runs on ubuntu-latest with the exact
    # clang-format-21 the rest of the org pins (apt.llvm.org). The build/test
    # job below runs in an Arch container instead, because Arch's rolling
    # `clang` package is ahead of 21 and would reformat against a different
    # major — the project standard is clang-format 21, not the distro default.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # fetch-tags, deliberately. The recipe check run further down decides
      # its last arm on whether the LOCAL clone holds refs/tags/<pkgver>: with
      # a tagless checkout it prints SKIPPED forever, so a sha256sums that is
      # still a placeholder would outlive the release it waits for and no run
      # would ever say so. actions/checkout fetches with --no-tags unless this
      # is set, and a shallow fetch would not carry the tagged commit anyway.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check clang-format
        # The roots live in ci/format-dirs.txt, which the scope check below
        # reads too: a directory nobody formats cannot appear without one of
        # these two steps saying so.
        #
        # -print0/-0 for paths with spaces, a parenthesised extension filter so
        # the -o cannot swallow the directory list, and -r because without it an
        # empty result makes clang-format read stdin and hang rather than fail.
        # A wedged job in this project once held a runner until it was cancelled by hand.
        run: |
          mapfile -t dirs < <(grep -v '^#' ci/format-dirs.txt)
          find "${dirs[@]}" \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.mm' \) -print0 \
            | xargs -0 -r clang-format-21 --dry-run --Werror

      - name: Check every tracked source is reachable by the formatter
        run: ./ci/scripts/check-format-scope.sh

      - name: Prove the fd-harvest gate discriminates
        run: ./ci/scripts/check-fd-harvest.selftest.sh

      - name: One clamped SCM_RIGHTS harvest, not two
        # cmsg_len says what the SENDER attached. XNU keeps reporting that
        # after truncation while msg_controllen shrinks to what arrived, so a
        # loop that subtracts CMSG_LEN(0) from it walks off a stack buffer and
        # hands every int past the end to fcntl(). Linux rewrites cmsg_len to
        # what it delivered, which is why no test running here can see the
        # difference and why this is a source-shape gate rather than a test.
        run: ./ci/scripts/check-fd-harvest.sh

      - name: Check every skip carries a reason
        # A test that skips without saying why is indistinguishable from a test
        # that passed. Costs a second and builds nothing.
        run: ./ci/scripts/check-skip-reasons.sh

      - name: BIGNUM deleters cleanse, and the mirror still names its canonical
        # The master-list fixture's deleter is a marked mirror of the
        # middleware's, and the registry that pairs them compares names and
        # sites, never bodies -- so it reported nothing while this one had
        # stopped cleansing. Checks the call and the marker as two separate
        # failures, and every other BIGNUM deleter in the checkout as a third.
        run: ./ci/scripts/check-cleansing-deleters.sh

      - name: BIGNUM deleter gate can still tell red from green
        run: ./ci/scripts/check-cleansing-deleters.selftest.sh

      - name: Changelog and version agree on the pending release
        # Run on every push with the version this tree is heading for, so the
        # agreement is proved weeks before the tag rather than first on a tag
        # that cannot be taken back. The release job calls the same script with
        # the tag's version.
        run: ci/scripts/check-release-lockstep.sh "$(head -n1 VERSION | tr -d '[:space:]')"

      - name: Every job carries a time bound
        # An unbounded job that hangs holds a runner for six hours and will
        # not serve its log until the run is cancelled, so the failing test
        # cannot even be named. This fails when a new job arrives without a
        # bound, which is the only moment the omission is cheap to fix.
        run: ci/scripts/check-job-timeouts.sh

      - name: Every shipped gate is wired into CI
        # A gate nobody runs is not a gate: this repository shipped
        # tools/dup-scan.py and tools/canonical-types.py, both self-tested and
        # both green, and no workflow here named either until the two steps
        # below arrived with this check.
        run: ci/scripts/check-gates-wired.sh

      - name: Gate-wiring check self-test
        run: ci/scripts/check-gates-wired.selftest.sh

      - name: Canonical declaration registry
        # Single-checkout subset of the workspace scan. The cross-repository
        # half -- duplicate bodies between two checkouts -- needs every tree
        # side by side, which no single repository's CI has; this half is the
        # part one repository can prove on its own.
        run: python3 tools/canonical-types.py --repo "$(basename "$PWD")"

      - name: Duplicate bodies (this checkout)
        run: python3 tools/dup-scan.py --repo "$(basename "$PWD")"

      - name: Every first-party version floor names the major in VERSION
        # Grepping for one spelling of an old floor cannot see the floors
        # written another way, and a floor a major behind still configures
        # and still builds. This measures the property instead: every
        # first-party find_package/find_dependency floor must name the major
        # the VERSION file names. It reads VERSION and never `git describe`, so
        # it is decidable before a tag exists -- which is the whole window in
        # which the mistake is cheap. --min 1 is the vacuum guard: a scan that
        # matches nothing is unmeasured, not clean.
        run: ci/scripts/check-version-floors.sh --min 1

      - name: Prove the floor gate still fails when it should
        # Every case is a fixture tree: no compiler, no build, seconds to
        # run. A gate nobody has seen fail is a line in a workflow file.
        run: ./ci/scripts/check-version-floors.selftest.sh

      - name: The version this tree stamps names the major in VERSION
        # The floor gate reads VERSION and the sources, so it stays green
        # whatever the version derivation does, and a check that configures
        # with git switched off is measuring the one input under which a tag
        # cannot win. Between code freeze and the tag `git describe` still
        # answers with the PREVIOUS release, and a tree that lets it decide
        # installs a package whose major contradicts its own VERSION, changelog
        # and packaging. This configures the real CMakeLists against a stubbed
        # tag, in both directions, and creates no tag anywhere.
        run: ci/scripts/check-version-stamp.sh --verbose

      - name: Prove the stamp gate still fails when it should
        # Seven fixtures, no compiler, no build. Two of them are shapes that
        # have really been written: the tag deciding unconditionally, and git
        # being ignored altogether.
        run: ./ci/scripts/check-version-stamp.selftest.sh
      - name: The Arch recipe fetches the tarball this project publishes
        # Two scripts, because a gate nobody proves is a gate nobody trusts:
        # the selftest perturbs the recipe -- and the tree around it -- and
        # requires each refusal to name its own arm, then the gate runs over
        # the committed recipe. It prints how many cases it ran, which is the
        # only count that cannot go stale.
        # Neither touches the network — `git ls-remote` against these SSH
        # remotes hangs on a developer machine, and a gate that can hang is
        # worse than one that can fail.
        run: |
          ./packaging/arch/check-recipe.selftest.sh
          ./packaging/arch/check-recipe.sh

      - name: The release-asset check can still fail
        run: ./ci/scripts/check-release-assets.selftest.sh

      - name: The release workflow checks its asset set before publishing
        # Structural only: the job that runs gh release create runs the
        # --staged check before it. Whether the set is right is measured on
        # the tag, over the files themselves.
        run: ./ci/scripts/check-release-assets.sh --wired

      - name: Every uploaded artefact has someone to download it
        # An artefact whose name no download step can match is built, kept for
        # ninety days and dropped from the release without a word: the release
        # simply carries one asset fewer. Names only -- whether the consumer is
        # ordered after the producer is the needs question, which this
        # repository answers only if it carries check-release-artifacts.sh.
        run: |
          ./ci/scripts/check-artifact-names.selftest.sh
          ./ci/scripts/check-artifact-names.sh

      # Every self-test in this repository, by pathspec, and each one must
      # report the cases it ran and how many proved the gate red. A self-test
      # nothing runs proves as much as no self-test, and a runner that read only
      # exit codes would accept `exit 0` as a body.
      - name: Run every self-test
        run: ./ci/scripts/run-selftests.sh

      # A step can land in a job that does not run on push, or before the
      # checkout that creates the directory its working-directory names, and
      # nothing says so: the wiring check sees the name and the timeout check
      # sees the bound. This reads the workflows as data and fails on both.
      - name: Every step can run where it was placed
        run: ./ci/scripts/workflow-step-order.py

  docs-check:
    # The public-API documentation gate. Self-contained for the same reason
    # format-check is: doxygen only PARSES the headers, so this needs neither
    # LibreMiddleware nor Qt nor a build — the export macro is handled by the
    # Doxyfile's own PREDEFINED, and no include is followed.
    #
    # It exists as a job because the gate was previously only ever run by hand.
    # A documentation rule nothing runs in CI is a rule that holds until the
    # first person who does not know about it, which for an undocumented public
    # symbol means it ships.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Verify the enum-value warning is actually honoured
        # WARN_IF_UNDOC_ENUM_VAL is what makes an undocumented ENUMERATOR fail
        # this gate; WARN_IF_UNDOCUMENTED alone does not reach enum values, and
        # several public types here are enums whose individual values are the
        # contract consumers branch on. A doxygen too old to know the tag would
        # simply ignore it and this job would still pass — enforcing nothing
        # while looking green. So confirm the tag survived config parsing
        # before trusting the run below. `-x_noenv` prints only settings that
        # DIFFER from the default, and the default is NO, so the tag appears
        # here if and only if it was understood and applied.
        run: |
          doxygen --version
          doxygen -x_noenv Doxyfile.publicapi | grep '^WARN_IF_UNDOC_ENUM_VAL' \
            || { echo "::error::this doxygen does not honour WARN_IF_UNDOC_ENUM_VAL;" \
                      "undocumented enumerators would pass unnoticed. Pin a newer doxygen."; \
                 exit 1; }

      - name: Check public API documentation
        # Doxyfile.publicapi sets WARN_AS_ERROR = FAIL_ON_WARNINGS, so the EXIT
        # CODE is the honest check and this step needs nothing more than
        # running it. Deliberately NOT piped into `grep -i warning`: a pipe
        # reports the GREP's status, which is 1 when nothing matches — that
        # spelling fails on success and passes on failure.
        #
        # mkdir first: OUTPUT_DIRECTORY is build/doc/publicapi, and doxygen
        # errors out rather than creating a missing nested path, which on a
        # fresh checkout (no build/) is exit 1 for a reason unrelated to
        # documentation.
        run: |
          mkdir -p build/doc/publicapi
          doxygen Doxyfile.publicapi

  build-linux:
    # Arch container: a rolling-release distro whose packages track current
    # LibreMiddleware build/runtime deps (pcsclite, OpenSC). pacman provides
    # openssl, pcsclite, OpenSC (for LibreMiddleware), gtest, and — unlike
    # this job's older Core+Wire-only shape — qt6-base (Core/DBus/Test in one
    # package, same as the client job below) and dbus (dbus-run-session,
    # which client/qt/tests/CMakeLists.txt requires at configure time once
    # ClientQt builds here). ClientQt is turned ON in this job for one reason
    # only: the ABI snapshot check below is otherwise blind to
    # liblibrescrs-agentclient-qt.so, and this is the job that runs that check —
    # the fuller D-Bus/socket/transport-parity Qt suite still lives in the
    # client job below.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # Where LibreMiddleware is installed and where the core finds it.
      LM_PREFIX: /opt/libremiddleware
      # Git ref of LibreMiddleware to build against. Track its trunk during the
      # development cycle (LibreLinux/LibreCelik do the same); pin to a release
      # tag once LibreMiddleware tags releases. find_package(LibreMiddleware 5.0)
      # in CMakeLists.txt enforces the required version independently of this ref.
      MIDDLEWARE_REF: main
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel cmake ninja git pkgconf \
            openssl pcsclite opensc \
            gtest dbus \
            qt6-base \
            python-jsonschema  # LibreMiddleware's plugin-manifest validation needs it during the build below

      - uses: actions/checkout@v4
        with:
          path: LibreAgent

      # --- LibreMiddleware: build from source + install to a prefix ---------
      # The core consumes the installed CONFIG package
      # (find_package(LibreMiddleware 5.0 REQUIRED CONFIG)), so it must exist on
      # disk first. SHARED + plugins ON to match how LibreLinux acquires it;
      # native signing backend (the CI default) — DSS is only a test oracle.
      - name: Checkout LibreMiddleware
        uses: actions/checkout@v4
        with:
          repository: LibreSCRS/LibreMiddleware
          ref: ${{ env.MIDDLEWARE_REF }}
          path: LibreMiddleware
          fetch-depth: 0
          submodules: recursive   # LM vendors OpenSC as a git submodule (thirdparty/opensc-source)

      - name: Build & install LibreMiddleware (Release, SHARED)
        working-directory: LibreMiddleware
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LM_PREFIX" \
            -DLIBREMIDDLEWARE_BUILD_SHARED=ON
          cmake --build build -j4
          cmake --install build

      # --- LibreAgentCore: configure / build --------------------------
      - name: Configure (RelWithDebInfo, ClientQt ON)
        working-directory: LibreAgent
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DLIBRESCRS_AGENT_WERROR=ON \
            -DLIBREAGENT_BUILD_CLIENT_QT=ON

      - name: Build
        working-directory: LibreAgent
        run: |
          # set -o pipefail is explicit: without it `| tee` reports tee's status
          # and a failed build becomes a green step, after which the warning
          # check measures a log that was never produced.
          set -o pipefail
          LC_ALL=C cmake --build build -j4 2>&1 | tee build.log

      - name: Check the discovered test set
        working-directory: LibreAgent
        run: ./ci/scripts/test-manifest-gate.sh --check build linux

      - name: The warning floor is still reachable
        # warning-gate.py judges the LOG, so a tree that has LOST compile units
        # makes it refuse every full build and blame the build. This judges the
        # configured graph instead, so the message names the stale number.
        working-directory: LibreAgent
        run: ./ci/scripts/check-warning-floor.sh build

      - name: Warning-floor check self-test
        working-directory: LibreAgent
        run: ./ci/scripts/check-warning-floor.selftest.sh

      - name: Check the warning baseline
        # Counted by the [-Wname] tag, never by the message text: diagnostics
        # are localised. --require-key means a compiler the baseline has no
        # section for FAILS rather than being reported: the sentence that used to
        # stand here -- "an unknown compiler is reported, not failed" -- described
        # the behaviour this flag removed. The key here is whatever GCC the
        # archlinux:latest image carries on the day, so this job loses its key the
        # moment Arch moves the compiler; pinning it means pinning the image by
        # digest, the way ci/coverage-env.txt pins the environment it records in.
        working-directory: LibreAgent
        run: ./ci/scripts/warning-gate.py --check --require-key build.log --build-dir build

      - name: Check the wire vocabulary manifest is current
        # The manifest is generated but committed, like the ABI baseline
        # below: CI proves the checked-in copy still matches what the
        # contract grammar produces, the same way that check proves the
        # checked-in symbol list still matches what the build produces.
        # Compared by hash -- `diff`'s exit code has been seen returning 0
        # for genuinely different files, so it is not trustworthy here.
        #
        # wire-vocabulary-regen (wire/tools/regen-manifest.cmake) writes the
        # generator's output to a .tmp file and renames it over the
        # committed manifest only on a successful run, so a generator
        # refusal already fails this step on its own, via the non-zero exit
        # from `cmake --build` -- the hash check below is only reached once
        # regeneration itself succeeded, and it exists to catch the case
        # where it succeeded with DIFFERENT content than what is committed.
        working-directory: LibreAgent
        run: |
          sha256sum wire/wire-vocabulary.json > /tmp/wire-vocabulary.sha256
          cmake --build build -j4 --target wire-vocabulary-regen
          sha256sum -c /tmp/wire-vocabulary.sha256 || {
            echo "::error::The committed wire vocabulary manifest is stale. Run the wire-vocabulary-regen target and commit the result."
            git --no-pager diff -- wire/wire-vocabulary.json
            exit 1
          }

      - name: Check ABI snapshot vs 5.x baseline
        # 5.x baseline — minor-version additions tracked; removals or
        # signature drift forbidden. Additions land via an intentional
        # baseline regeneration (`abi-snapshot.sh --update`) reviewed in
        # the same commit as the new public symbol.
        #
        # The snapshot has FOUR sections: the Core archive's symbols, the
        # Wire archive's symbols, the ClientQt shared library's symbols +
        # its SONAME, and the ClientQt public value types' LAYOUT. Wire
        # builds by default, so its section is always present here.
        # ClientQt ON in the Configure step above is what makes the last
        # two non-empty here instead of silently absent, and the Build step
        # above is what produces the layout probe the LAYOUT section reads
        # (the script fails rather than skipping that section if the probe
        # is missing). See ci/scripts/abi-snapshot.sh's own header for why
        # the symbol sections are never merged, which wire symbols the
        # ClientQt section deliberately does and does not record, and why a
        # clean symbol diff alone does not mean "no ABI impact".
        working-directory: LibreAgent
        run: ./ci/scripts/abi-snapshot.sh --check build

      # --- Tests ------------------------------------------------------------
      # All moved tests are bus-free and run against the five backend fakes, so
      # no dbus-run-session and no reader are needed. PIN/live-card suites do not
      # exist in the neutral core.
      - name: Test
        working-directory: LibreAgent
        run: |
          # The pipe is removed rather than patched. The runner's default shell
          # for a `run:` step is `bash -e {0}` WITHOUT pipefail, so
          # `ctest ... | tee ctest.log` reports the status of tee: a failed
          # suite showed as a green step, and a check reading that log
          # afterwards passed too. With no pipe there is no question about what
          # the default is. Measured: the old shape exits 0 on a ctest that
          # fails, this one exits 1.
          set +e
          ctest --test-dir build --output-on-failure --no-tests=error > ctest.log 2>&1
          rc=$?
          set -e
          cat ctest.log
          echo "ctest rc=$rc"
          exit "$rc"

      - name: Check the skip ledger
        # always(): the ledger's whole point is the run where something did not
        # run, including runs where something also failed.
        if: always()
        working-directory: LibreAgent
        run: ./ci/scripts/skip-ledger.sh --check ctest.log linux

      # --- Installed CONFIG package smoke -----------------------------------
      # Prove the EXPORTED package actually resolves downstream — nothing the
      # in-tree build or ctest above exercises. Install the core to a throwaway
      # prefix, then configure + build the standalone tests/pkgsmoke consumer
      # against it via find_package(LibreAgent CONFIG). This walks the
      # install/export rules, the generated LibreAgentConfig.cmake, and its
      # find_dependency(LibreMiddleware / OpenSSL) re-exposure chain. The consumer's
      # prefix path carries both the core prefix and $LM_PREFIX so the transitively
      # re-exposed LibreMiddleware/OpenSSL dependencies resolve. Mirrors how the
      # LibreMiddleware step above is built + `cmake --install`ed and then consumed
      # as an installed CONFIG package.
      - name: Installed CONFIG package smoke (tests/pkgsmoke)
        working-directory: LibreAgent
        env:
          CORE_PREFIX: /opt/libreagent
        run: |
          cmake --install build --prefix "$CORE_PREFIX"
          cmake -S tests/pkgsmoke -B build-pkgsmoke -G Ninja \
            -DCMAKE_PREFIX_PATH="$CORE_PREFIX;$LM_PREFIX"
          cmake --build build-pkgsmoke -j4

      # --- Thread-sanitizer gate for the core concurrency invariants --------
      # OperationManager owns the worker pool / bounded queue / zombie-drain and
      # PropertyEmissionThrottler coalesces on a timer; both are plain C++
      # jthread/mutex/condition_variable and are the concurrency surface that
      # moved into this repo. A regression that drops a lock still passes the
      # plain RelWithDebInfo Test step but races under TSan. The installed LM is
      # uninstrumented, which is fine — the guarded state is core-owned.
      - name: TSan (core concurrency)
        working-directory: LibreAgent
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          # One spelling of the selection, used by the build, by the run and by
          # the count below. Three copies is how one of them stops matching.
          SUITES="OperationManager|ZombieWorkerDrain|PropertyEmissionThrottler|AgentShutdownUnderLoad|PrompterKeepAliveDrain|SignSeamKeepAliveDrain|RawCryptoCaptureGuard|Watchdog"
          cmake --build build-tsan --target OperationManagerTest ZombieWorkerDrainTest PropertyEmissionThrottlerTest AgentShutdownUnderLoadTest PrompterKeepAliveDrainTest SignSeamKeepAliveDrainTest RawCryptoCaptureGuardTest WatchdogTest -j4
          ctest --test-dir build-tsan -R "$SUITES" --output-on-failure --no-tests=error
          # --no-tests=error fails only when the selection matches NOTHING, so the
          # denominator of a -R leg is the expression, not the build directory:
          # renaming or deleting a case the expression names still builds, still
          # runs, and covers less. This is that number, regenerated by whatever
          # change alters the set.
          #
          # A committed listing of the whole build directory cannot serve here,
          # and that is measured rather than assumed: this leg builds only the
          # suites it sanitizes, and with one ctest entry per case the discovery
          # step writes a NOT_BUILT placeholder for every binary the leg does not
          # build -- 88 of them. (1408 is what `grep -c _NOT_BUILT` returns over that
          # listing and it is a line count, not a count of entries: ctest prints
          # sixteen "Looked in the following places" lines per placeholder.)
          # The manifest check refuses those, correctly, so
          # the number below is what judges this leg.
          n=$(ctest --test-dir build-tsan -N -R "$SUITES" | grep -c '^ *Test *#' || true)
          test "$n" = 53 || { echo "the sanitizer leg selected $n cases, not 53"; exit 1; }

  client:
    # The Qt client library (LibreAgent::ClientQt), full stack: same
    # Arch-container LibreMiddleware acquisition as build-linux, plus Qt6
    # (Arch's qt6-base package bundles QtDBus/QtTest under the one package —
    # same pattern LibreLinux's own CI uses for its KDE prompter) and dbus
    # (dbus-run-session, which client/qt/tests/CMakeLists.txt already wraps
    # each D-Bus/socket/transport-parity suite's own add_test() in — this job
    # supplies the binary, not an outer ctest wrapper). Core ON (LM-backed) +
    # Wire ON + ClientQt ON in one build/test pass: this is LibreCelik's
    # actual build shape, and the full suite here includes HeaderAcceptance
    # plus every D-Bus/socket/parity integration test alongside the plain
    # Core/Wire unit tests build-linux already covers on its own.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      LM_PREFIX: /opt/libremiddleware
      MIDDLEWARE_REF: main
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel cmake ninja git pkgconf \
            openssl pcsclite opensc \
            gtest dbus \
            python-jsonschema \
            qt6-base

      - uses: actions/checkout@v4
        with:
          path: LibreAgent

      # --- LibreMiddleware: build from source + install to a prefix ---------
      # Same as build-linux's own step (Core here needs it too — ClientQt
      # requires LIBREAGENT_BUILD_WIRE, and this job leaves Core at its
      # default ON, so it needs LM just like build-linux does).
      - name: Checkout LibreMiddleware
        uses: actions/checkout@v4
        with:
          repository: LibreSCRS/LibreMiddleware
          ref: ${{ env.MIDDLEWARE_REF }}
          path: LibreMiddleware
          fetch-depth: 0
          submodules: recursive

      - name: Build & install LibreMiddleware (Release, SHARED)
        working-directory: LibreMiddleware
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LM_PREFIX" \
            -DLIBREMIDDLEWARE_BUILD_SHARED=ON
          cmake --build build -j4
          cmake --install build

      # --- LibreAgent (Core+Wire+ClientQt): configure / build / test --------
      - name: Configure (RelWithDebInfo, ClientQt ON)
        working-directory: LibreAgent
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DLIBRESCRS_AGENT_WERROR=ON \
            -DLIBREAGENT_BUILD_CLIENT_QT=ON

      - name: Build
        working-directory: LibreAgent
        run: cmake --build build -j4

      - name: Check the discovered test set
        working-directory: LibreAgent
        run: ./ci/scripts/test-manifest-gate.sh --check build client

      - name: Test
        working-directory: LibreAgent
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The pipe is removed rather than patched. The runner's default shell
          # for a `run:` step is `bash -e {0}` WITHOUT pipefail, so
          # `ctest ... | tee ctest.log` reports the status of tee: a failed
          # suite showed as a green step, and a check reading that log
          # afterwards passed too. With no pipe there is no question about what
          # the default is. Measured: the old shape exits 0 on a ctest that
          # fails, this one exits 1.
          set +e
          ctest --test-dir build --output-on-failure --no-tests=error > ctest.log 2>&1
          rc=$?
          set -e
          cat ctest.log
          echo "ctest rc=$rc"
          exit "$rc"

      - name: Check the skip ledger
        # always(): the ledger's whole point is the run where something did not
        # run, including runs where something also failed.
        if: always()
        working-directory: LibreAgent
        run: ./ci/scripts/skip-ledger.sh --check ctest.log client

  client-lm-less:
    # The Wire+ClientQt "no LibreMiddleware anywhere" guarantee: Core stays
    # OFF and CMAKE_DISABLE_FIND_PACKAGE_LibreMiddleware=ON turns any
    # accidental find_package(LibreMiddleware ...) into a hard configure-time
    # error rather than a silent no-op — this runner never checks out, builds,
    # or installs LibreMiddleware at all, unlike every other job in this
    # workflow. Proves a Qt-only ClientQt consumer never has to acquire LM
    # just to build against this library. Qt6 + dbus are still installed
    # (ClientQt's own dependency), same packages as the client job above.
    #
    # Also walks the installed CONFIG package end-to-end on this same LM-less
    # prefix: `cmake --install`, then a standalone find_package(LibreAgent
    # COMPONENTS ClientQt) consumer project (written here rather than checked
    # into the tree — this job's LM-less runner is the only place it has
    # anything to prove; contrast tests/pkgsmoke, which the client-carrying
    # build-linux job installs alongside a real LM install and so doubles as
    # a permanent regression fixture) that constructs AgentClient and calls
    # readers(), proving cmake/InstallExport.cmake's ClientQt component
    # (library + public headers incl. the generated Export.h +
    # LibreAgentClientQtTargets) actually resolves and links downstream, not
    # just in-tree. Needs a live QCoreApplication (DBusTransport's queued
    # terminal emits deliver through the event loop, same as
    # client/qt/tests/ClientTestMain.cpp) and a session bus to connect to.
    #
    # This is also the one job configured with
    # LIBREAGENT_INSTALL_WIRE_ARCHIVE=OFF: it never carries a real Core
    # install, so it is the natural place to prove the installed ClientQt
    # component still resolves downstream with libLibreAgentWire.a left out
    # of the install tree entirely (Wire is folded into
    # liblibrescrs-agentclient-qt.so as a static link regardless — see that
    # option's own comment in cmake/InstallExport.cmake). That is also why the
    # exported ClientQt doubles are turned off here by hand: their default
    # follows CLIENT_QT, they name LibreAgent::Wire in their own export, and an
    # install tree without that archive cannot carry them -- left implicit, the
    # configure refuses itself before a single file compiles.
    #
    # Two more fixtures get their only exercise on this same LM-less,
    # Core-less prefix: tests/pkgsmoke/subdir-version (add_subdirectory()s
    # this whole repo beneath its own wrapper project() to prove
    # GitVersion.cmake resolves LibreAgent's own PROJECT_VERSION rather than
    # inheriting the enclosing project's — the shape a platform backend like
    # LibreKDE's client/qt wrapper actually uses), and tests/pkgsmoke itself
    # run with PKGSMOKE_COMPONENTS=ClientQt against this prefix with
    # fixtures/LibreAgentCoreTargets.stub.cmake hand-planted into
    # lib/cmake/LibreAgent/ first, to reproduce a Core package and a
    # ClientQt-only package sharing one install prefix and prove
    # LibreAgentConfig.cmake.in's component filtering never include()s the
    # Core export a ClientQt-only consumer never asked for.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      CLIENTQT_PREFIX: /opt/libreagent-clientqt
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel cmake ninja git pkgconf \
            gtest dbus \
            qt6-base

      - uses: actions/checkout@v4
        with:
          path: LibreAgent

      # The exported ClientQt doubles are OFF here and nowhere else: their export
      # names LibreAgent::Wire, and this job's whole point is an install tree
      # without the wire archive, so the two options cannot both be on. What this
      # leg therefore does NOT cover is the doubles' own install/export --
      # LibreAgentClientQtTestSupportTargets.cmake is not written here. The job
      # that does write it is build-linux: its "Installed CONFIG package smoke"
      # step is the only one that runs `cmake --install` on a top-level
      # configuration with the doubles at their default ON, and then consumes
      # that prefix through tests/pkgsmoke. (The client job builds the doubles
      # but never installs the LibreAgent tree -- its only `cmake --install` is
      # LibreMiddleware's -- so it produces no Targets.cmake at all.)
      # The file is also named by the three packaging payload lists. The ctest
      # inventory is unaffected either way, because the doubles are still BUILT
      # when the project is top level.
      - name: Configure (Core OFF, Wire+ClientQt ON, LibreMiddleware disabled, Wire archive not installed)
        working-directory: LibreAgent
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBREAGENT_BUILD_CORE=OFF \
            -DLIBREAGENT_BUILD_WIRE=ON \
            -DLIBREAGENT_BUILD_CLIENT_QT=ON \
            -DLIBREAGENT_BUILD_CLIENT_QT_TEST_SUPPORT=OFF \
            -DLIBREAGENT_INSTALL_WIRE_ARCHIVE=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_LibreMiddleware=ON \
            -DLIBRESCRS_AGENT_WERROR=ON

      - name: Build
        working-directory: LibreAgent
        run: cmake --build build -j4

      - name: Check the discovered test set
        working-directory: LibreAgent
        run: ./ci/scripts/test-manifest-gate.sh --check build client-lm-less

      - name: Test
        working-directory: LibreAgent
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The pipe is removed rather than patched. The runner's default shell
          # for a `run:` step is `bash -e {0}` WITHOUT pipefail, so
          # `ctest ... | tee ctest.log` reports the status of tee: a failed
          # suite showed as a green step, and a check reading that log
          # afterwards passed too. With no pipe there is no question about what
          # the default is. Measured: the old shape exits 0 on a ctest that
          # fails, this one exits 1.
          set +e
          ctest --test-dir build --output-on-failure --no-tests=error > ctest.log 2>&1
          rc=$?
          set -e
          cat ctest.log
          echo "ctest rc=$rc"
          exit "$rc"

      - name: Check the skip ledger
        # always(): the ledger's whole point is the run where something did not
        # run, including runs where something also failed.
        if: always()
        working-directory: LibreAgent
        run: ./ci/scripts/skip-ledger.sh --check ctest.log client-lm-less

      - name: Install ClientQt to a throwaway prefix
        working-directory: LibreAgent
        run: cmake --install build --prefix "$CLIENTQT_PREFIX"

      - name: Installed CONFIG package smoke (ClientQt, LM-less)
        run: |
          mkdir -p /tmp/clientqt-consumer
          cat > /tmp/clientqt-consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(clientqt_consumer_smoke LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          find_package(LibreAgent 5.0 REQUIRED CONFIG COMPONENTS ClientQt)
          find_package(Qt6 REQUIRED COMPONENTS Core)
          add_executable(clientqt_consumer_smoke main.cpp)
          target_link_libraries(clientqt_consumer_smoke PRIVATE LibreAgent::ClientQt Qt6::Core)
          EOF
          cat > /tmp/clientqt-consumer/main.cpp <<'EOF'
          #include <LibreSCRS/AgentClient/AgentClient.h>

          #include <QCoreApplication>

          int main(int argc, char** argv)
          {
              QCoreApplication app(argc, argv);
              LibreSCRS::AgentClient::AgentClient client;
              return client.readers().isEmpty() ? 0 : 1;
          }
          EOF
          cmake -S /tmp/clientqt-consumer -B /tmp/clientqt-consumer-build -G Ninja \
            -DCMAKE_PREFIX_PATH="$CLIENTQT_PREFIX"
          cmake --build /tmp/clientqt-consumer-build -j4
          QT_QPA_PLATFORM=offscreen dbus-run-session -- /tmp/clientqt-consumer-build/clientqt_consumer_smoke

      # --- Subdirectory-consumption version smoke ----------------------------
      # tests/pkgsmoke/subdir-version add_subdirectory()s this whole repo
      # beneath its own wrapper project(wrapper VERSION 0.1.0), forcing Core
      # OFF (this LM-less runner has no LibreMiddleware to give it) and
      # Wire+ClientQt ON, then asserts LibreAgent's own PROJECT_VERSION
      # resolved to this repo's real VERSION rather than being silently
      # adopted from the enclosing project — the shape a platform backend
      # (e.g. LibreKDE's client/qt wrapper) actually embeds this repo in.
      # Runs in its own build tree, unrelated to build/ or $CLIENTQT_PREFIX
      # above.
      - name: Subdirectory-consumption version smoke (tests/pkgsmoke/subdir-version)
        working-directory: LibreAgent
        run: |
          cmake -S tests/pkgsmoke/subdir-version -B build-subdir-version -G Ninja
          cmake --build build-subdir-version -j4

      # --- tests/pkgsmoke, ClientQt-only + co-installation stub --------------
      # Reuses this job's own LM-less, Core-less $CLIENTQT_PREFIX install (a
      # real find_package(LibreAgent COMPONENTS ClientQt) prefix that never
      # had a real Core package in it) as the one place that can safely carry
      # fixtures/LibreAgentCoreTargets.stub.cmake — a fixture standing in for
      # a genuine LibreAgentCoreTargets.cmake, hand-planted into
      # lib/cmake/LibreAgent/ to reproduce a Core package and a ClientQt-only
      # package sharing one prefix (e.g. two components of one distribution
      # unpacked into a common install). The stub's own message(FATAL_ERROR
      # ...) fires if LibreAgentConfig.cmake.in's component filtering ever
      # regresses into include()-ing it for a consumer that only asked for
      # ClientQt; PKGSMOKE_COMPONENTS=ClientQt drives tests/pkgsmoke into
      # exactly that consumer shape (main_clientqt.cpp, linking only
      # LibreAgent::ClientQt).
      - name: Installed CONFIG package smoke (tests/pkgsmoke, ClientQt + co-installation stub)
        working-directory: LibreAgent
        run: |
          mkdir -p "$CLIENTQT_PREFIX/lib/cmake/LibreAgent"
          cp tests/pkgsmoke/fixtures/LibreAgentCoreTargets.stub.cmake \
            "$CLIENTQT_PREFIX/lib/cmake/LibreAgent/LibreAgentCoreTargets.cmake"
          cmake -S tests/pkgsmoke -B build-pkgsmoke-clientqt -G Ninja \
            -DCMAKE_PREFIX_PATH="$CLIENTQT_PREFIX" \
            -DPKGSMOKE_COMPONENTS=ClientQt
          cmake --build build-pkgsmoke-clientqt -j4

  pkcs11-facade:
    # The PKCS#11 facade in the configuration it actually ships in: no card
    # stack, no crypto library, no bus, no Qt. A build that happens to have
    # those available cannot show that the module does not need them, so this
    # is a separate job rather than one more step in an existing one.
    #
    # It is also the only job that builds the browser-loadable module itself.
    # The shared core has no host here, so without a module of its own the two
    # properties a loader cares about -- what it can see, and what it must find
    # first -- would only ever be checked on one platform backend's build.
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel cmake ninja git pkgconf \
            gtest opensc

      - uses: actions/checkout@v4
        with:
          path: LibreAgent

      - name: Configure (Core OFF, Wire + both pkcs11 components ON, LibreMiddleware disabled)
        working-directory: LibreAgent
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBREAGENT_BUILD_CORE=OFF \
            -DLIBREAGENT_BUILD_WIRE=ON \
            -DLIBREAGENT_BUILD_PKCS11_FACADE=ON \
            -DLIBREAGENT_BUILD_PKCS11_SOCKET_CLIENT=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_LibreMiddleware=ON \
            -DLIBRESCRS_AGENT_WERROR=ON

      - name: Build
        working-directory: LibreAgent
        timeout-minutes: 10
        run: cmake --build build -j4

      - name: Test
        working-directory: LibreAgent
        timeout-minutes: 10
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Prove the facade gate still fails when it should
        working-directory: LibreAgent
        run: ./ci/scripts/check-pkcs11-facade.selftest.sh

      - name: One exported symbol, nothing needed
        working-directory: LibreAgent
        run: ./ci/scripts/check-pkcs11-facade.sh build

      - name: Check the discovered test set
        working-directory: LibreAgent
        # The leg is spelled out, never interpolated: this workflow has no
        # strategy.matrix, and an empty expression would make the argument
        # vanish and send the gate looking for ci/test-manifest..txt.
        run: ./ci/scripts/test-manifest-gate.sh --check build pkcs11-facade

  wire-asan-macos:
    # The wire codec on Apple Clang, under AddressSanitizer. It exists because a
    # CborValue holding a Map was left addressing a freed buffer when a growing
    # vector relocated it, and nothing in this repo could see it: every job here
    # runs on Linux, where the same code is well-behaved, and the failure only
    # ever surfaced downstream as a bare "Bus error" from a macOS agent test.
    #
    # Wire-only on purpose -- no Core, so no LibreMiddleware, so no card stack to
    # build. That keeps this a couple of minutes rather than half an hour, which
    # is what makes it usable while working on the codec rather than only after.
    timeout-minutes: 30
    name: wire-asan (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # googletest as well as ninja: this job builds no LibreMiddleware, and
        # LibreMiddleware is where the other macOS jobs in this stack get their
        # vendored GTest from. Without it find_package(GTest REQUIRED) stops the
        # configure before a single test is compiled.
        run: brew install ninja googletest

      - name: Configure (wire only, ASan)
        run: |
          cmake -B build-wire-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBREAGENT_BUILD_CORE=OFF \
            -DLIBREAGENT_BUILD_WIRE=ON \
            -DLIBREAGENT_BUILD_CLIENT_QT=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

      - name: Build
        run: cmake --build build-wire-asan -j4

      - name: Test
        # --no-tests=error: ctest exits 0 when it finds nothing at all, so
        # without this a configuration that stopped generating these tests would
        # report success.
        env:
          # detect_container_overflow=0: GTest comes from Homebrew and is not
          # built with the sanitizer, so a std::vector<std::string> that lives
          # inside its uninstrumented code and is touched from instrumented code
          # trips a container-overflow that is not one. The report seen here was
          # in GTest's own GetTestSuite, at the same address on every run,
          # including runs of unmodified trunk -- ASan documents disabling this
          # one check for partially instrumented programs. Every other check
          # stays on, and the use-after-free this job exists for is found by
          # them.
          ASAN_OPTIONS: detect_leaks=0:detect_container_overflow=0
        run: ctest --test-dir build-wire-asan --output-on-failure --no-tests=error

      - name: Check the discovered test set
        # --no-tests=error above catches a configuration that stopped generating
        # these tests ALTOGETHER; it says nothing about one of them quietly
        # dropping out. Every other leg in this workflow commits its listing.
        run: ./ci/scripts/test-manifest-gate.sh --check build-wire-asan wire-asan-macos

  client-macos:
    # ClientQt's production transport on Apple platforms, actually exercised
    # here: until this job, nothing in this workflow ever built or ran
    # ClientQtSocketIntegrationTest on macOS -- LibreCelik's own build-macos
    # job runs LibreCelik's tests, not this repo's, and wire-asan-macos above
    # builds no ClientQt at all. Shape follows wire-asan-macos (macos-15,
    # Homebrew Ninja + GTest -- Core stays OFF so no LibreMiddleware is ever
    # built here, same reasoning as that job); the Qt install step and the
    # ClientQt cmake flags follow the client job above and LibreCelik's own
    # build-macos job (jurplel/install-qt-action@v4, Qt 6.10, clang_64).
    #
    # Test step runs ClientQt's whole local test package. It once ran two
    # targets short, on the reasoning that they were pre-existing failures
    # unrelated to the transport this job exists to prove; both are fixed and
    # the filter is gone, because a narrowing kept "until later" is one that
    # outlives the reason for it and quietly shrinks what the job proves.
    #
    #   * ClientQtSealedPayloadTest asserted a pipe's st_size reads back zero.
    #     That is Linux's answer; Darwin reports the bytes buffered. Both are
    #     right -- st_size describes a file extent and a pipe has none -- so
    #     the premise was a claim about one platform wearing the clothes of a
    #     claim about pipes. The case does not rest on it and no longer makes
    #     it.
    #   * HeaderAcceptance failed on the harness, not on any header. It passed
    #     Qt's include directories as -I, so a diagnostic raised inside Qt's
    #     own headers was fatal to a check about OUR headers, and a framework
    #     Qt -- what this action installs -- needs a framework search path
    #     before its umbrella headers resolve at all. It now passes them as
    #     -isystem plus -iframework, which is what CMake does for the real
    #     targets and the reason they never saw this.
    #
    #     The same change fixed a guard that was passing over nothing: the
    #     Qt-module allowlist matched /Qt<Name>/ and a framework spells it
    #     Qt<Name>.framework, so on Apple platforms it found zero modules and
    #     allowlisted them all. Measured by making a public header reach for
    #     QtGui: caught now, silently green before.
    timeout-minutes: 30
    name: client (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # googletest as well as ninja, same reasoning as wire-asan-macos:
        # this job builds no LibreMiddleware, and LibreMiddleware is where
        # the other macOS jobs in this stack get their vendored GTest from.
        run: brew install ninja googletest

      - name: Install Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Configure (Core OFF, Wire+ClientQt ON)
        # No -DLIBRESCRS_AGENT_WERROR=ON, unlike the Linux jobs above --
        # wire-asan-macos doesn't set it either. -Wshorten-64-to-32 fires on
        # src/wire/Framing.cpp's CMSG_SPACE/CMSG_LEN use under AppleClang
        # (a pre-existing warning, not something this job introduces or this
        # task's job to fix); turning WERROR on here would fail every build.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBREAGENT_BUILD_CORE=OFF \
            -DLIBREAGENT_BUILD_WIRE=ON \
            -DLIBREAGENT_BUILD_CLIENT_QT=ON

      - name: Build
        run: cmake --build build -j4

      - name: Test (ClientQt package)
        # --no-tests=error: ctest exits 0 when it finds nothing at all, so
        # without this a configuration that stopped generating any tests
        # would report success.
        #
        # No -E any more. It named two targets and the job title carried the
        # exemption, which is the honest way to defer something -- but the
        # count it left behind, 23 where the package has 25, is exactly the
        # denominator a passing percentage hides. Both are fixed; see the job
        # comment above.
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Check the discovered test set
        # This leg had no listing, and it is the only place several of these
        # targets are built with an Apple toolchain at all.
        run: ./ci/scripts/test-manifest-gate.sh --check build client-macos

  fuzz-cbor:
    # Untrusted-decoder fuzz gate (moved from LibreDarwin, whose own
    # ci.yml dropped this job once the wire codec/framing/message model
    # moved into this repo's own LibreAgent::Wire — see that repo's history
    # for the original job this is ported from): the CBOR decoder parses
    # input from any local caller over the socket wire (and, on macOS, the
    # browser-extension facade) — an untrusted-input surface that must never
    # crash / invoke UB. AppleClang ships no libFuzzer runtime, so this leg
    # builds the fuzzer standalone on Linux clang with -fsanitize=fuzzer,address
    # (the decoder + QCBOR are platform-neutral; nothing macOS-specific is
    # exercised). This job shells out to ci/scripts/fuzz-cbor.sh — the exact
    # same script a dev runs locally — rather than duplicating its
    # QCBOR-pinning / build / run steps inline, so the two never drift.
    # Bounded run over the seed corpus; any crash/UB/leak fails the job.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-21
        # The decoder uses std::expected, which libstdc++ gates on
        # __cpp_concepts >= 202002L — advertised by clang 19+, not the
        # runner image's older default clang. Pin the same LLVM 21 the
        # format-check job pins; libclang-rt-21-dev carries the
        # libFuzzer/ASan runtimes ci/scripts/fuzz-cbor.sh needs.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21 libclang-rt-21-dev

      - name: Run the bounded fuzz
        run: ci/scripts/fuzz-cbor.sh --time 120 --clang clang++-21

  fuzz-csca-ldif:
    # The other untrusted-input surface in this repository, and the one that had
    # no fuzz cover: the CSCA anchor import walks a directory export a person
    # downloads from a public ICAO PKD mirror. Before any signature has been
    # verified it runs an RFC 2849 line grammar, a base64 decoder, its OWN
    # short/long/indefinite BER length decoder, and the three small scalar
    # parsers the same path uses for its state file — six readers, all six
    # fuzzed here. Same standalone shape as fuzz-cbor above and for the same
    # reason: -fsanitize=fuzzer needs a fuzzer-capable clang, not this repo's
    # default build compiler. This job shells out to
    # ci/scripts/fuzz-csca-ldif.sh — the exact same script a dev runs locally —
    # rather than duplicating its build and run steps inline, so the two never
    # drift. Bounded run over the seed corpus; any crash/UB/leak fails the job.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # Git ref of LibreMiddleware whose HEADERS this compiles against. Tracks
      # its trunk during the development cycle, like build-linux above. Nothing
      # of LibreMiddleware is BUILT or linked here: the readers under test are
      # in an anonymous namespace of one translation unit, and the script's
      # link drops every section no path from the fuzz entry point reaches.
      MIDDLEWARE_REF: main
    steps:
      - uses: actions/checkout@v4
        with:
          path: LibreAgent

      - name: Checkout LibreMiddleware headers
        uses: actions/checkout@v4
        with:
          repository: LibreSCRS/LibreMiddleware
          ref: ${{ env.MIDDLEWARE_REF }}
          path: LibreMiddleware

      - name: Install clang-21
        # Same LLVM 21 the fuzz-cbor job pins, for the same std::expected
        # reason; libclang-rt-21-dev carries the libFuzzer/ASan runtimes. lld-21
        # is the third requirement here and not there: the driver includes the
        # implementation file, so functions that call into LibreMiddleware are
        # emitted but never reached, and lld --gc-sections drops them while
        # still failing the link for anything the fuzzed path does reach.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21 libclang-rt-21-dev lld-21

      - name: Run the bounded fuzz
        working-directory: LibreAgent
        run: ci/scripts/fuzz-csca-ldif.sh --time 120 --clang clang++-21 --lm-include ../LibreMiddleware/include

  coverage:
    # Arch container: a rolling-release distro whose packages track current
    # LibreMiddleware build/runtime deps (pcsclite, OpenSC). pacman provides
    # openssl, pcsclite, OpenSC (for LibreMiddleware), gtest, and — unlike
    # this job's older Core+Wire-only shape — qt6-base (Core/DBus/Test in one
    # package, same as the client job below) and dbus (dbus-run-session,
    # which client/qt/tests/CMakeLists.txt requires at configure time once
    # ClientQt builds here). ClientQt is turned ON in this job for one reason
    # only: the ABI snapshot check below is otherwise blind to
    # liblibrescrs-agentclient-qt.so, and this is the job that runs that check —
    # the fuller D-Bus/socket/transport-parity Qt suite still lives in the
    # client job below.
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # Where LibreMiddleware is installed and where the core finds it.
      LM_PREFIX: /opt/libremiddleware
      # Git ref of LibreMiddleware to build against. Track its trunk during the
      # development cycle (LibreLinux/LibreCelik do the same); pin to a release
      # tag once LibreMiddleware tags releases. find_package(LibreMiddleware 5.0)
      # in CMakeLists.txt enforces the required version independently of this ref.
      MIDDLEWARE_REF: main
    # Not on pull_request: this pass costs an hour and the moment a
    # function actually lands is the push to main. Manual only until one
    # measured run says what it really costs on a hosted runner.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel cmake ninja git pkgconf \
            openssl pcsclite opensc \
            gtest dbus \
            qt6-base \
            python-jsonschema  # LibreMiddleware's plugin-manifest validation needs it during the build below

      - uses: actions/checkout@v4
        with:
          path: LibreAgent

      # --- LibreMiddleware: build from source + install to a prefix ---------
      # The core consumes the installed CONFIG package
      # (find_package(LibreMiddleware 5.0 REQUIRED CONFIG)), so it must exist on
      # disk first. SHARED + plugins ON to match how LibreLinux acquires it;
      # native signing backend (the CI default) — DSS is only a test oracle.
      - name: Checkout LibreMiddleware
        uses: actions/checkout@v4
        with:
          repository: LibreSCRS/LibreMiddleware
          ref: ${{ env.MIDDLEWARE_REF }}
          path: LibreMiddleware
          fetch-depth: 0
          submodules: recursive   # LM vendors OpenSC as a git submodule (thirdparty/opensc-source)

      - name: Build & install LibreMiddleware (Release, SHARED)
        working-directory: LibreMiddleware
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LM_PREFIX" \
            -DLIBREMIDDLEWARE_BUILD_SHARED=ON
          cmake --build build -j4
          cmake --install build

      # --- LibreAgentCore: configure / build --------------------------

      - name: Install gcovr
        # Pinned: the baseline records the gcovr version it was measured with
        # and the gate refuses to compare across versions, because the exclude
        # semantics that decide the denominator have changed between them.
        run: python3 -m pip install --break-system-packages 'gcovr==8.6'

      - name: Configure (coverage)
        working-directory: LibreAgent
        run: cmake --preset coverage -DCMAKE_PREFIX_PATH="$LM_PREFIX"

      - name: Build
        working-directory: LibreAgent
        run: cmake --build build-cov -j4

      - name: Test
        working-directory: LibreAgent
        run: |
          set +e
          ctest --test-dir build-cov --output-on-failure --no-tests=error > ctest.log 2>&1
          rc=$?
          set -e
          cat ctest.log
          echo "ctest rc=$rc"
          exit "$rc"

      - name: Check coverage against the baseline
        working-directory: LibreAgent
        # The committed baseline was measured with a different compiler than
        # this runner uses, so the FIRST authorised run of this job is expected
        # to refuse to compare and say so. Refusing is the design: a coverage
        # number carries the configuration it was measured under, and comparing
        # across configurations is how a gap becomes an artefact. Record a
        # runner-side baseline with --update, review it in the same commit, and
        # from then on this step is a ratchet.
        run: ./ci/scripts/coverage-gate.py --check --expect-key GNU-16 build-cov

  package:
    # Distribution packages, built in the target distribution's own container.
    #
    # Containers rather than apt/dnf on the runner: ubuntu-latest is one
    # distribution in one version and cannot produce a trixie or an fc43
    # package, and a container makes the same build reproducible with one
    # `docker run` on a development machine.
    #
    # Images are pinned by digest, not by tag. A tag moves under you; a digest
    # does not.
    name: package (${{ matrix.slug }})
    if: vars.PACKAGE_JOB_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Measured locally at 30 minutes for the slowest image, times
    # about 2.5. A job with no limit does not fail when it hangs -- it burns
    # hours and hands back no log, because /logs answers 404 while it runs.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: debian13
            image: debian@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
          - slug: ubuntu2604
            image: ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
          - slug: fedora43
            image: fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check out the working tree as the gate will read it
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Upstream packages come from their own published release. This job is
      # therefore enabled from the bottom up -- middleware first, then the
      # agent libraries, then the hosts -- because a job wired to a release
      # that does not exist yet is a job that has never run, and this project
      # has paid for one of those before. Set the repository variable
      # PACKAGE_JOB_ENABLED to true once the upstream release carries packages.
      - name: Fetch the upstream packages from their releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ matrix.slug }}" in fedora43) fam=rpm ;; *) fam=deb ;; esac
          ver=$(tr -d '[:space:]' < VERSION)
          mkdir -p "$RUNNER_TEMP/librescrs-packages/out/${{ matrix.slug }}/LibreMiddleware/$fam"
          # The slug is part of the asset name upstream: Debian 13 and
          # Ubuntu 26.04 build .deb files with identical names, so the
          # publisher puts the distribution into the name and a consumer that
          # asked for "*.$fam" would fetch both and install packages built
          # against another distribution's glibc alongside its own.
          gh release download "$ver" --repo LibreSCRS/LibreMiddleware \
            --pattern "*.${{ matrix.slug }}.$fam" \
            --dir "$RUNNER_TEMP/librescrs-packages/out/${{ matrix.slug }}/LibreMiddleware/$fam"

      - name: Gate
        run: |
          # set +e first: the default shell here is `bash -eo pipefail`, so a
          # failing gate would end the step before its exit code could be read,
          # and the echo below would be dead text pretending to be a measurement.
          set +e
          bash packaging/ci/package-gate.sh "${{ matrix.image }}" "$RUNNER_TEMP/librescrs-packages/out"
          rc=$?
          set -e
          echo "PACKAGE_GATE_RC=$rc"
          test "$rc" = 0

      - name: Upload the packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.slug }}
          path: ${{ runner.temp }}/librescrs-packages/out/${{ matrix.slug }}/**
          if-no-files-found: warn
