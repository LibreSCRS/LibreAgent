# SPDX-License-Identifier: LGPL-2.1-or-later
name: CI

# LibreAgent ships three independently-buildable components: the
# platform-neutral agent core (LibreAgent::Core, LM-backed), the socket-wire
# protocol library (LibreAgent::Wire, dependency-free), and the Qt client
# library LibreCelik consumes (LibreAgent::ClientQt, Wire + Qt6 only — no LM).
# This workflow has: the shared gates (LibreSCRS/ci) plus the checks only
# this repository has and the format;
# build-linux, the full Core+Wire+ClientQt stack built against
# LibreMiddleware from source at the commit deps.lock names, tested with the
# D-Bus/socket/transport-parity suites included (LibreCelik's build shape),
# the installed CONFIG package smoke and a ThreadSanitizer leg over the
# concurrency core;
# client-lm-less, the guarantee that Wire+ClientQt build/test/install
# standalone where LibreMiddleware is never built or installed at all;
# pkcs11-facade, the module in the configuration it ships in; and the two
# macOS legs. The fuzz runs are in fuzz.yml (pull requests and weekly).

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  # Manual runs. Without this, a change that only misbehaves on a macOS runner
  # can be exercised nowhere before it lands: every other job here is Linux, and
  # a branch that is not a pull request gets no run at all.
  workflow_dispatch:

# Every job asks for what it needs and nothing more.
permissions: {}

jobs:
  gates:
    # The shared gates this step names (LibreSCRS/ci): the workflows' bounds
    # and pins, a reason on every skip, the version everywhere, the locked
    # upstream revisions, every self-test this repository ships, and the Arch
    # recipe; then the source-shape checks only this repository has, and the
    # format. Nothing here builds.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Shared gates
        uses: LibreSCRS/ci/actions/gates@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          gates: check-workflows check-skip-reasons check-version deps-lock selftests check-recipe
          recipe-args: --pin _qcbor_commit=cmake/FetchQCBOR.cmake

      - name: One clamped SCM_RIGHTS harvest, not two
        # cmsg_len says what the SENDER attached. XNU keeps reporting that
        # after truncation while msg_controllen shrinks to what arrived, so a
        # loop that subtracts CMSG_LEN(0) from it walks off a stack buffer and
        # hands every int past the end to fcntl(). Linux rewrites cmsg_len to
        # what it delivered, which is why no test running here can see the
        # difference and why this is a source-shape gate rather than a test.
        run: ./ci/scripts/check-fd-harvest.sh

      - name: BIGNUM deleters cleanse, and the mirror still names its canonical
        # The master-list fixture's deleter is a marked mirror of the
        # middleware's, and nothing else compares their bodies. Checks the call
        # and the marker as two separate failures, and every other BIGNUM
        # deleter in the checkout as a third.
        run: ./ci/scripts/check-cleansing-deleters.sh

      # The exact clang-format-21 the rest of the org uses (apt.llvm.org); the
      # build jobs' Arch images carry a newer major that formats differently.
      # Last, so a formatting slip cannot hide a gate finding above.
      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check clang-format
        # Every tracked C++ source; -r because an empty list would make
        # clang-format read stdin and hang rather than fail.
        run: |
          git ls-files -z -- '*.cpp' '*.h' '*.hpp' '*.mm' \
            | xargs -0 -r clang-format-21 --dry-run --Werror

  docs-check:
    # The public-API documentation gate. Self-contained for the same reason
    # format-check is: doxygen only PARSES the headers, so this needs neither
    # LibreMiddleware nor Qt nor a build — the export macro is handled by the
    # Doxyfile's own PREDEFINED, and no include is followed.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Verify the enum-value warning is actually honoured
        # WARN_IF_UNDOC_ENUM_VAL is what makes an undocumented ENUMERATOR fail
        # this gate; WARN_IF_UNDOCUMENTED alone does not reach enum values, and
        # several public types here are enums whose individual values are the
        # contract consumers branch on. A doxygen too old to know the tag would
        # simply ignore it and this job would still pass. `-x_noenv` prints only
        # settings that DIFFER from the default, and the default is NO, so the
        # tag appears here if and only if it was understood and applied.
        run: |
          doxygen --version
          doxygen -x_noenv Doxyfile.publicapi | grep '^WARN_IF_UNDOC_ENUM_VAL' \
            || { echo "::error::this doxygen does not honour WARN_IF_UNDOC_ENUM_VAL;" \
                      "undocumented enumerators would pass unnoticed. Pin a newer doxygen."; \
                 exit 1; }

      - name: Check public API documentation
        # Doxyfile.publicapi sets WARN_AS_ERROR = FAIL_ON_WARNINGS, so the EXIT
        # CODE is the honest check. Deliberately NOT piped into `grep -i
        # warning`: a pipe reports the GREP's status. mkdir first: doxygen
        # errors out rather than creating a missing nested OUTPUT_DIRECTORY.
        run: |
          mkdir -p build/doc/publicapi
          doxygen Doxyfile.publicapi

  build-linux:
    # Arch container: a rolling-release distro whose packages track current
    # LibreMiddleware build/runtime deps (pcsclite, OpenSC). pacman provides
    # openssl, pcsclite, OpenSC (for LibreMiddleware), gtest, qt6-base
    # (Core/DBus/Test in one package) and dbus (dbus-run-session, which
    # client/qt/tests/CMakeLists.txt requires at configure time and wraps each
    # D-Bus/socket/transport-parity suite's own add_test() in).
    #
    # Core ON (LM-backed) + Wire ON + ClientQt ON in one build/test pass: this
    # is LibreCelik's actual build shape, and the suite includes
    # HeaderAcceptance plus every D-Bus/socket/parity integration test beside
    # the plain Core/Wire unit tests.
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    container: archlinux:latest
    permissions:
      contents: read
    env:
      # Where LibreMiddleware is installed and where the core finds it.
      LM_PREFIX: /opt/libremiddleware
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel cmake ninja git pkgconf \
            openssl pcsclite opensc \
            gtest dbus \
            qt6-base \
            python python-jsonschema  # LibreMiddleware's plugin-manifest validation needs jsonschema during the build below
          # The workspace is mounted from the runner and owned by its user;
          # git refuses to read a repository owned by someone else, and every
          # check of a checkout's commit below asks git.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: LibreAgent
          persist-credentials: false

      # --- LibreMiddleware: at the commit deps.lock names, built + installed --
      # The core consumes the installed CONFIG package
      # (find_package(LibreMiddleware 5.0 REQUIRED CONFIG)), so it must exist on
      # disk first. SHARED + plugins ON to match how LibreLinux acquires it;
      # native signing backend (the CI default) — DSS is only a test oracle.
      - name: Checkout LibreMiddleware at the lock
        uses: LibreSCRS/ci/actions/checkout-deps@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          root: LibreAgent
          names: LibreMiddleware
          path: .
          fetch-depth: '0'
          submodules: recursive   # LM vendors OpenSC as a git submodule (thirdparty/opensc-source)

      - name: Build & install LibreMiddleware (Release, SHARED)
        working-directory: LibreMiddleware
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LM_PREFIX" \
            -DLIBREMIDDLEWARE_BUILD_SHARED=ON
          cmake --build build -j4
          cmake --install build

      # --- LibreAgent (Core+Wire+ClientQt): configure / build -----------------
      # -DLIBRESCRS_AGENT_WERROR=ON: every warning fails the build, which is
      # why this repository keeps no warning baseline.
      - name: Configure (RelWithDebInfo, ClientQt ON)
        working-directory: LibreAgent
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DLIBRESCRS_AGENT_WERROR=ON \
            -DLIBREAGENT_BUILD_CLIENT_QT=ON

      - name: Build
        working-directory: LibreAgent
        run: cmake --build build -j4

      - name: Check the wire vocabulary manifest is current
        # The manifest is generated but committed: CI proves the checked-in
        # copy still matches what the contract grammar produces. Compared by
        # hash -- `diff`'s exit code has been seen returning 0 for genuinely
        # different files. wire-vocabulary-regen renames its output over the
        # committed manifest only on a successful run, so a generator refusal
        # already fails this step through `cmake --build`; the hash check
        # catches a success with DIFFERENT content.
        working-directory: LibreAgent
        run: |
          sha256sum wire/wire-vocabulary.json > /tmp/wire-vocabulary.sha256
          cmake --build build -j4 --target wire-vocabulary-regen
          sha256sum -c /tmp/wire-vocabulary.sha256 || {
            echo "::error::The committed wire vocabulary manifest is stale. Run the wire-vocabulary-regen target and commit the result."
            git --no-pager diff -- wire/wire-vocabulary.json
            exit 1
          }

      - name: Test
        working-directory: LibreAgent
        env:
          QT_QPA_PLATFORM: offscreen
        # --no-tests=error: ctest exits 0 when it finds nothing at all.
        run: ctest --test-dir build --output-on-failure --no-tests=error

      # --- Installed CONFIG package smoke -----------------------------------
      # Prove the EXPORTED package actually resolves downstream: install the
      # tree to a throwaway prefix, then configure + build the standalone
      # tests/pkgsmoke consumer against it via find_package(LibreAgent CONFIG).
      # This walks the install/export rules, the generated
      # LibreAgentConfig.cmake, and its find_dependency(LibreMiddleware /
      # OpenSSL) re-exposure chain. It is also the only step that installs a
      # top-level configuration with the exported ClientQt doubles ON, so it
      # is where LibreAgentClientQtTestSupportTargets.cmake is written and
      # consumed.
      - name: Installed CONFIG package smoke (tests/pkgsmoke)
        working-directory: LibreAgent
        env:
          CORE_PREFIX: /opt/libreagent
        run: |
          cmake --install build --prefix "$CORE_PREFIX"
          cmake -S tests/pkgsmoke -B build-pkgsmoke -G Ninja \
            -DCMAKE_PREFIX_PATH="$CORE_PREFIX;$LM_PREFIX"
          cmake --build build-pkgsmoke -j4

      # --- Thread-sanitizer gate for the core concurrency invariants --------
      # OperationManager owns the worker pool / bounded queue / zombie-drain and
      # PropertyEmissionThrottler coalesces on a timer; both are plain C++
      # jthread/mutex/condition_variable. A regression that drops a lock still
      # passes the plain Test step but races under TSan. The installed LM is
      # uninstrumented, which is fine — the guarded state is core-owned.
      - name: TSan (core concurrency)
        working-directory: LibreAgent
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          # One spelling of the selection, used by the build, by the run and by
          # the count below. Three copies is how one of them stops matching.
          SUITES="OperationManager|ZombieWorkerDrain|PropertyEmissionThrottler|AgentShutdownUnderLoad|PrompterKeepAliveDrain|SignSeamKeepAliveDrain|RawCryptoCaptureGuard|Watchdog"
          cmake --build build-tsan --target OperationManagerTest ZombieWorkerDrainTest PropertyEmissionThrottlerTest AgentShutdownUnderLoadTest PrompterKeepAliveDrainTest SignSeamKeepAliveDrainTest RawCryptoCaptureGuardTest WatchdogTest -j4
          ctest --test-dir build-tsan -R "$SUITES" --output-on-failure --no-tests=error
          # --no-tests=error fails only when the selection matches NOTHING, so the
          # denominator of a -R leg is the expression, not the build directory:
          # renaming or deleting a case the expression names still builds, still
          # runs, and covers less. This is its floor: losing a case is red,
          # adding one is not a workflow edit. (A committed listing of the whole build
          # directory cannot serve: this leg builds only the suites it
          # sanitizes, and discovery writes a NOT_BUILT placeholder for every
          # other binary.)
          n=$(ctest --test-dir build-tsan -N -R "$SUITES" | grep -c '^ *Test *#' || true)
          test "$n" -ge 55 || { echo "the sanitizer leg selected $n cases, fewer than 55"; exit 1; }

      - name: Every test binary still registers its tests
        # --no-tests=error catches a configuration that registers nothing at
        # all; the floor catches one binary quietly losing its tests.
        uses: LibreSCRS/ci/actions/gates@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          root: LibreAgent
          gates: test-floor
          build-dir: build
          floor: ci/test-floor.linux.txt

  client-lm-less:
    # The Wire+ClientQt "no LibreMiddleware anywhere" guarantee: Core stays
    # OFF and CMAKE_DISABLE_FIND_PACKAGE_LibreMiddleware=ON turns any
    # accidental find_package(LibreMiddleware ...) into a hard configure-time
    # error rather than a silent no-op — this runner never checks out, builds,
    # or installs LibreMiddleware at all. Proves a Qt-only ClientQt consumer
    # never has to acquire LM just to build against this library.
    #
    # Also walks the installed CONFIG package end-to-end on this same LM-less
    # prefix: a standalone find_package(LibreAgent COMPONENTS ClientQt)
    # consumer that constructs AgentClient and calls readers(), proving
    # cmake/InstallExport.cmake's ClientQt component resolves and links
    # downstream, not just in-tree.
    #
    # This is also the one job configured with
    # LIBREAGENT_INSTALL_WIRE_ARCHIVE=OFF: it never carries a real Core
    # install, so it proves the installed ClientQt component still resolves
    # with libLibreAgentWire.a left out of the install tree entirely (Wire is
    # folded into liblibrescrs-agentclient-qt.so regardless). That is also why
    # the exported ClientQt doubles are turned off here by hand: their export
    # names LibreAgent::Wire, and an install tree without that archive cannot
    # carry them.
    #
    # Two more fixtures get their only exercise on this LM-less, Core-less
    # prefix: tests/pkgsmoke/subdir-version (GitVersion.cmake resolves
    # LibreAgent's own PROJECT_VERSION beneath an enclosing project) and
    # tests/pkgsmoke with PKGSMOKE_COMPONENTS=ClientQt over a prefix that also
    # holds a Core-targets stub, proving the component filtering never
    # include()s the Core export a ClientQt-only consumer never asked for.
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    container: archlinux:latest
    permissions:
      contents: read
    env:
      CLIENTQT_PREFIX: /opt/libreagent-clientqt
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel cmake ninja git pkgconf \
            gtest dbus \
            qt6-base \
            python

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: LibreAgent
          persist-credentials: false

      - name: Configure (Core OFF, Wire+ClientQt ON, LibreMiddleware disabled, Wire archive not installed)
        working-directory: LibreAgent
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBREAGENT_BUILD_CORE=OFF \
            -DLIBREAGENT_BUILD_WIRE=ON \
            -DLIBREAGENT_BUILD_CLIENT_QT=ON \
            -DLIBREAGENT_BUILD_CLIENT_QT_TEST_SUPPORT=OFF \
            -DLIBREAGENT_INSTALL_WIRE_ARCHIVE=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_LibreMiddleware=ON \
            -DLIBRESCRS_AGENT_WERROR=ON

      - name: Build
        working-directory: LibreAgent
        run: cmake --build build -j4

      - name: Test
        working-directory: LibreAgent
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Install ClientQt to a throwaway prefix
        working-directory: LibreAgent
        run: cmake --install build --prefix "$CLIENTQT_PREFIX"

      - name: Installed CONFIG package smoke (ClientQt, LM-less)
        run: |
          mkdir -p /tmp/clientqt-consumer
          cat > /tmp/clientqt-consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(clientqt_consumer_smoke LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          find_package(LibreAgent 5.0 REQUIRED CONFIG COMPONENTS ClientQt)
          find_package(Qt6 REQUIRED COMPONENTS Core)
          add_executable(clientqt_consumer_smoke main.cpp)
          target_link_libraries(clientqt_consumer_smoke PRIVATE LibreAgent::ClientQt Qt6::Core)
          EOF
          cat > /tmp/clientqt-consumer/main.cpp <<'EOF'
          #include <LibreSCRS/AgentClient/AgentClient.h>

          #include <QCoreApplication>

          int main(int argc, char** argv)
          {
              QCoreApplication app(argc, argv);
              LibreSCRS::AgentClient::AgentClient client;
              return client.readers().isEmpty() ? 0 : 1;
          }
          EOF
          cmake -S /tmp/clientqt-consumer -B /tmp/clientqt-consumer-build -G Ninja \
            -DCMAKE_PREFIX_PATH="$CLIENTQT_PREFIX"
          cmake --build /tmp/clientqt-consumer-build -j4
          QT_QPA_PLATFORM=offscreen dbus-run-session -- /tmp/clientqt-consumer-build/clientqt_consumer_smoke

      - name: Subdirectory-consumption version smoke (tests/pkgsmoke/subdir-version)
        working-directory: LibreAgent
        run: |
          cmake -S tests/pkgsmoke/subdir-version -B build-subdir-version -G Ninja
          cmake --build build-subdir-version -j4

      - name: Installed CONFIG package smoke (tests/pkgsmoke, ClientQt + co-installation stub)
        working-directory: LibreAgent
        run: |
          mkdir -p "$CLIENTQT_PREFIX/lib/cmake/LibreAgent"
          cp tests/pkgsmoke/fixtures/LibreAgentCoreTargets.stub.cmake \
            "$CLIENTQT_PREFIX/lib/cmake/LibreAgent/LibreAgentCoreTargets.cmake"
          cmake -S tests/pkgsmoke -B build-pkgsmoke-clientqt -G Ninja \
            -DCMAKE_PREFIX_PATH="$CLIENTQT_PREFIX" \
            -DPKGSMOKE_COMPONENTS=ClientQt
          cmake --build build-pkgsmoke-clientqt -j4

      - name: Every test binary still registers its tests
        # --no-tests=error catches a configuration that registers nothing at
        # all; the floor catches one binary quietly losing its tests.
        uses: LibreSCRS/ci/actions/gates@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          root: LibreAgent
          gates: test-floor
          build-dir: build
          floor: ci/test-floor.client-lm-less.txt

  pkcs11-facade:
    # The PKCS#11 facade in the configuration it actually ships in: no card
    # stack, no crypto library, no bus, no Qt. A build that happens to have
    # those available cannot show that the module does not need them, so this
    # is a separate job rather than one more step in an existing one.
    #
    # It is also the only job that builds the browser-loadable module itself,
    # so the two properties a loader cares about -- what it can see, and what
    # it must find first -- are checked here.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel cmake ninja git pkgconf \
            gtest opensc \
            python

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: LibreAgent
          persist-credentials: false

      - name: Configure (Core OFF, Wire + both pkcs11 components ON, LibreMiddleware disabled)
        working-directory: LibreAgent
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBREAGENT_BUILD_CORE=OFF \
            -DLIBREAGENT_BUILD_WIRE=ON \
            -DLIBREAGENT_BUILD_PKCS11_FACADE=ON \
            -DLIBREAGENT_BUILD_PKCS11_SOCKET_CLIENT=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_LibreMiddleware=ON \
            -DLIBRESCRS_AGENT_WERROR=ON

      - name: Build
        working-directory: LibreAgent
        run: cmake --build build -j4

      - name: Test
        working-directory: LibreAgent
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: One exported symbol, nothing needed
        working-directory: LibreAgent
        run: ./ci/scripts/check-pkcs11-facade.sh build

      - name: Every test binary still registers its tests
        # --no-tests=error catches a configuration that registers nothing at
        # all; the floor catches one binary quietly losing its tests.
        uses: LibreSCRS/ci/actions/gates@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          root: LibreAgent
          gates: test-floor
          build-dir: build
          floor: ci/test-floor.pkcs11-facade.txt

  wire-asan-macos:
    # The wire codec on Apple Clang, under AddressSanitizer. It exists because a
    # CborValue holding a Map was left addressing a freed buffer when a growing
    # vector relocated it, and nothing in this repo could see it: every other
    # job runs on Linux, where the same code is well-behaved.
    #
    # Wire-only on purpose -- no Core, so no LibreMiddleware, so no card stack to
    # build. That keeps this a couple of minutes rather than half an hour.
    timeout-minutes: 30
    name: wire-asan (macOS)
    runs-on: macos-15
    permissions:
      contents: read
    env:
      # detect_container_overflow=0: GTest comes from Homebrew and is not
      # built with the sanitizer, so a std::vector<std::string> that lives
      # inside its uninstrumented code and is touched from instrumented code
      # trips a container-overflow that is not one. ASan documents disabling
      # this one check for partially instrumented programs; every other check
      # stays on, and the use-after-free this job exists for is found by them.
      #
      # Job-wide, not on the Test step: the test binaries are also run to LIST
      # their cases, by every ctest call including the listing check's
      # `ctest -N`, and a step without this aborts before it has listed anything.
      ASAN_OPTIONS: detect_leaks=0:detect_container_overflow=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        # googletest as well as ninja: this job builds no LibreMiddleware, which
        # is where the other macOS jobs in this stack get their vendored GTest.
        run: brew install ninja googletest

      - name: Configure (wire only, ASan)
        run: |
          cmake -B build-wire-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBREAGENT_BUILD_CORE=OFF \
            -DLIBREAGENT_BUILD_WIRE=ON \
            -DLIBREAGENT_BUILD_CLIENT_QT=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

      - name: Build
        run: cmake --build build-wire-asan -j4

      - name: Test
        run: ctest --test-dir build-wire-asan --output-on-failure --no-tests=error

      - name: Every test binary still registers its tests
        # --no-tests=error catches a configuration that registers nothing at
        # all; the floor catches one binary quietly losing its tests.
        uses: LibreSCRS/ci/actions/gates@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          gates: test-floor
          build-dir: build-wire-asan
          floor: ci/test-floor.wire-asan-macos.txt

  client-macos:
    # ClientQt's production transport on Apple platforms: the only place
    # ClientQtSocketIntegrationTest and several other targets are built and run
    # with an Apple toolchain. Shape follows wire-asan-macos (Homebrew Ninja +
    # GTest, Core OFF so no LibreMiddleware is built here).
    #
    # The Test step runs ClientQt's whole local test package, with no -E: a
    # narrowing kept "until later" outlives the reason for it and quietly
    # shrinks what the job proves.
    timeout-minutes: 30
    name: client (macOS)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: brew install ninja googletest

      - name: Install Qt 6.10.3
        # An exact version, not 6.10.*: a patch release arriving between two
        # runs of the same commit is a different build.
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: '6.10.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Configure (Core OFF, Wire+ClientQt ON)
        # No -DLIBRESCRS_AGENT_WERROR=ON, unlike the Linux jobs:
        # -Wshorten-64-to-32 fires on src/wire/Framing.cpp's CMSG_SPACE/CMSG_LEN
        # use under AppleClang, a pre-existing warning.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBREAGENT_BUILD_CORE=OFF \
            -DLIBREAGENT_BUILD_WIRE=ON \
            -DLIBREAGENT_BUILD_CLIENT_QT=ON

      - name: Build
        run: cmake --build build -j4

      - name: Test (ClientQt package)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Every test binary still registers its tests
        # --no-tests=error catches a configuration that registers nothing at
        # all; the floor catches one binary quietly losing its tests.
        uses: LibreSCRS/ci/actions/gates@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          gates: test-floor
          build-dir: build
          floor: ci/test-floor.client-macos.txt
