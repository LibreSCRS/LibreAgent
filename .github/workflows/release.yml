# SPDX-License-Identifier: LGPL-2.1-or-later
name: Release

# What a release of LibreAgent publishes: the deterministic source tarball
# (with the QCBOR sources the build would otherwise fetch), the binary
# packages for every supported distribution -- the downstream releases
# download the -dev packages from here -- a CycloneDX bill of materials naming
# the vendored codec, SHA256SUMS over all of it, and one signature bundle per
# file.
#
# preflight -> {source-tarball, packages} -> seal -> publish. Everything that
# can refuse a release runs in preflight, before anything is built or signed:
# the tag's signature, the version agreement, the locked upstream revisions.
#
# mode=rehearse runs the whole chain on any ref without publishing anything:
# the tag verifier is proved on real and forged fixtures instead of a tag, the
# packages build their upstreams from deps.lock instead of downloading a
# release, the signatures use an ephemeral key with no transparency log, and
# the release is read back from the staged files. mode=publish is refused on a
# ref that is not a tag. A tag push is publish. A branch push that changes
# something a package is built from is a rehearsal: the one path to the
# packages, on the push that can break them and no other.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
    branches: [main, 'ci/**']
    paths:
      - 'packaging/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'deps.lock'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearse (any ref) or publish (a tag ref only)'
        type: choice
        options: [rehearse, publish]
        default: rehearse

permissions: {}

# One run per ref at a time: a re-run racing a still-live earlier run would
# hand gh release create an already-existing release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.pre.outputs.mode }}
      version: ${{ steps.pre.outputs.version }}
      is_prerelease: ${{ steps.pre.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pre
        uses: LibreSCRS/ci/actions/release-preflight@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          mode: ${{ inputs.mode || (github.ref_type == 'tag' && 'publish' || 'rehearse') }}
          version-min: '1'

  source-tarball:
    # Produced by this project, not by GitHub: GitHub's archive/refs/tags
    # tarball is not ours to assert. This one carries the QCBOR tree the
    # packages build from, and is byte-identical run to run.
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: 261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
          path: .ci
          persist-credentials: false
      - name: Deterministic source tarball
        run: >-
          .ci/scripts/make-source-tarball --name libreagent
          --vendor thirdparty/QCBOR=https://github.com/laurencelundblade/QCBOR.git@cmake/FetchQCBOR.cmake
          --out out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tarball-artifacts
          path: out/*.orig.tar.gz
          if-no-files-found: error
          retention-days: 3

  packages:
    # The same build and verification as the Packages workflow, one slug per
    # job. On a tag the LibreMiddleware packages are downloaded from its
    # published release (it is released first); in a rehearsal they are built
    # from the commit deps.lock names.
    name: packages (${{ matrix.slug }})
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slug: [debian13, ubuntu2604, fedora43, fedora44, opensusetw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the packages
        id: build
        uses: LibreSCRS/ci/actions/pkg-build@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          slug: ${{ matrix.slug }}
          upstream: ${{ github.ref_type == 'tag' && 'release' || 'source' }}
          version: ${{ github.ref_type == 'tag' && needs.preflight.outputs.version || '' }}
      - name: Install and judge the stack
        uses: LibreSCRS/ci/actions/pkg-verify@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          slug: ${{ matrix.slug }}
          packages: ${{ steps.build.outputs.art }}/${{ matrix.slug }}
          hook: packaging/ci/verify-installed.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packages-${{ matrix.slug }}
          path: ${{ steps.build.outputs.dist }}
          if-no-files-found: error
          retention-days: 3

  seal:
    needs: [preflight, source-tarball, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '*-artifacts'
          merge-multiple: true
          path: artifacts
      # The package names already carry their slug and the collector refused a
      # collision, so merging the slugs cannot overwrite one package with
      # another.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: 'packages-*'
          merge-multiple: true
          path: artifacts
      # The bill of materials is read from the tree the release is cut from:
      # its pins are the build's inputs, which a scanner of the finished
      # packages cannot see (the codec is folded into the libraries).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: LibreAgent
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: 261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
          path: .ci
          persist-credentials: false
      - name: Bill of materials
        run: |
          .ci/scripts/make-sbom --root LibreAgent --out artifacts/sbom.cdx.json --require qcbor
          .ci/scripts/check-sbom artifacts/sbom.cdx.json
      - uses: LibreSCRS/ci/actions/release-seal@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sealed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [preflight, seal]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sealed
          path: artifacts
      - uses: LibreSCRS/ci/actions/release-publish@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}
          is_prerelease: ${{ needs.preflight.outputs.is_prerelease }}
